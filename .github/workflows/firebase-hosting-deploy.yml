name: Build and deploy RADAR to Firebase Hosting

on:
  # Refresh the generated news, image and article sitemaps even when newsroom
  # content changes without a source-code commit.
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - main
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/firebase-hosting-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build website and generate sitemaps
        working-directory: frontend
        run: npm run build

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IJWI_RY_UKURI }}

      - name: Deploy Firebase Hosting
        working-directory: frontend
        run: npx --yes firebase-tools deploy --only hosting --project ijwi-ry--ukuri --non-interactive
