<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RADAR">
  <!-- The compact cut of the mark: at 16px the inner ring, the trail and the
       second contact read as blur, so the tab icon carries only what stays
       legible. Same geometry as RadarLogo.tsx and Logo-compact.png. -->
  <circle cx="32" cy="32" r="32" fill="#1877F2"/>
  <circle cx="32" cy="32" r="24" fill="#ffffff" fill-opacity="0.34"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-opacity="0.9"/>
  <line x1="32" y1="32" x2="48.99" y2="15.01" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round"/>
  <circle cx="42.1" cy="20" r="4.2" fill="#7dd3fc"/>
  <circle cx="32" cy="32" r="3.2" fill="#ffffff"/>
</svg>
