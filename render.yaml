# =============================================================================
# Render Blueprint for the StudentNews BACKEND ONLY (Express 4 + Mongoose 8).
#
# Architecture this file assumes:
#   - Backend API  -> Render (this blueprint)
#   - Frontend SPA -> Firebase Hosting (see frontend/firebase.json)
#   - Database     -> MongoDB Atlas (M0 free tier)
#
# Render Blueprints deploy a single VCS repo. Because this repo is a monorepo
# (backend/ and frontend/), the web service below points at the backend folder
# via `rootDir: backend`. The frontend is intentionally NOT defined here:
# Render's Node buildpack serves the API only (the Express app has no SPA
# catch-all and does not serve the built frontend), and Firebase Hosting is the
# frontend host. Keep this blueprint backend-only to match the design.
#
# HOW TO USE
#   1. Render -> New -> Blueprint -> connect
#        https://github.com/mugisha-kevin-250/ijwi-ry-ukuri
#      Render reads this file and creates the web service below.
#   2. Paste the env values from the gitignored `.env.render` into the dashboard.
#      JWT secrets are generated by Render; nothing secret is committed here.
#   3. Atlas -> Network Access: add Render's static outbound IP (or 0.0.0.0/0 while
#      testing), otherwise the service builds but never connects to the database.
#   4. See DEPLOYMENT.md for the frontend (Firebase) side and the smoke checklist.
# =============================================================================

services:
  - type: web
    # Render derives the public URL from this name:
    #   https://studentnews-backend.onrender.com
    # The frontend needs it (VITE_API_URL / API_ORIGIN), so keep the name unless
    # you also update frontend/.env.production and CLIENT_URL below.
    name: studentnews-backend
    runtime: node                 # required: Render's blueprint default is `image`,
                                  # so we must opt into the native Node buildpack.
    rootDir: backend              # build & start from the backend/ subfolder
    env: production

    # PLAN NOTE: `starter` ($7/mo) is chosen because Render's `free` instance
    # type does NOT support persistent disks, and uploads must survive redeploys.
    # If you accept losing uploaded files on every restart/redeploy you can set
    # `plan: free` and delete the `disks:` block + UPLOAD_DIR env var below.
    plan: starter
    # REGION NOTE: oregon is Render's default region. Pick the region closest to
    # your MongoDB Atlas cluster to cut latency (Atlas M0 free tier is usually on
    # AWS us-east-1 / a nearby region; align them if possible).
    region: oregon

    # Backend has NO package-lock.json, so use `npm install` (NOT `npm ci`).
    # NODE_ENV=production (set below) makes npm skip devDependencies (nodemon).
    buildCommand: npm install --omit=dev
    # package.json -> "start": "node src/server.js"
    startCommand: npm start

    # Render only marks a deploy "live" once this returns 200.
    # GET /api/health exists in backend/src/app.js.
    healthCheckPath: /api/health

    autoDeployTrigger: default

    envVars:
      # --- runtime config ---
      - key: NODE_ENV
        value: production
      # Pins the Node buildpack version for reproducible builds (Express 4 /
      # Mongoose 8 run fine on Node 20 LTS).
      - key: NODE_VERSION
        value: 20
      # NOTE: Render automatically injects PORT (default 10000). backend/src/
      # config/env.js reads process.env.PORT, so no need to set it here.

      # --- secrets: generated by Render, never committed ---
      - key: JWT_SECRET
        generateValue: true       # Render creates a strong random value on first deploy
        sync: false               # subsequent blueprint applies won't clobber it
      - key: JWT_REFRESH_SECRET
        generateValue: true
        sync: false

      # --- database ---
      # PASTE the real value in the dashboard (it lives in the gitignored
      # `.env.render`). `sync: false` means the placeholder below will not
      # overwrite what you paste.
      - key: MONGODB_URI
        # backend/src/config/database.js keeps the database name in the URI path
        # (/ijwi); without it the app writes to Atlas's default `test` database.
        # If it is unset in production the app fails fast instead of silently
        # starting an in-memory Mongo server, so a missing value shows up as a
        # crashed deploy rather than quietly wiped data.
        sync: false
        value: REPLACE_WITH_MONGODB_ATLAS_SRV_URI
      - key: CLIENT_URL
        # The frontend origin: Firebase Hosting serves both domains below;
        # backend/src/app.js builds a CORS allowlist from CLIENT_URL (comma-
        # separated), so both are listed. If you add a custom domain, append it.
        sync: false
        value: https://ijwi-ry--ukuri.web.app,https://ijwi-ry--ukuri.firebaseapp.com

      # --- upload persistence ---
      # Points uploads at the persistent disk mounted below. backend/src/config/env.js
      # reads UPLOAD_DIR, and both backend/src/routes/uploadRoutes.js (multer
      # destination) and backend/src/app.js (express.static) resolve their paths
      # through it, so uploads land on the disk instead of the source checkout.
      # Without this the files would be written under /opt/render/project/src,
      # which Render wipes on every deploy and where a disk CANNOT be mounted.
      - key: UPLOAD_DIR
        value: /var/uploads
      # The repo tracks backend/uploads, and Render checks the source out at
      # /opt/render/project/src. server.js copies any file missing from
      # UPLOAD_DIR here on boot, so images the database already references are
      # not broken on the first deploy of an empty disk. Existing files on the
      # disk are never overwritten.
      - key: SEED_UPLOADS_DIR
        value: /opt/render/project/src/backend/uploads

    # Persistent disk so uploaded images survive redeployments / restarts.
    # mountPath MUST be absolute and OUTSIDE the source dir (/opt/render/project/
    # src). Size is in GB (Render minimum = 1 GB). The Express app must write and
    # serve uploads from this exact path (see UPLOAD_DIR above).
    disks:
      - name: uploads
        mountPath: /var/uploads
        size: 1
